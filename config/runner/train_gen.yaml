defaults:
  - _self_
  - dataset: TODO
  - aug: TODO
  - loss: TODO
  - model: ifa
  - metric:
      - TODO
      - TODO
      - TODO


loader:
  # torch Dataloader zone
  train_loader_params:
    batch_size: 6
    num_workers: 6
    persistent_workers: True
    
  val_loader_params:
    batch_size: 12
    num_workers: 6
    persistent_workers: True

  # customized keywords, should be removed if using regular loader
  train_epoch_splits: 8
  train_shuffle: true


optimizer:
  name: Adam
  optimizer_params:
    lr: 0.000006
    weight_decay: 0


scheduler:
  name: OneCycleLR
  scheduler_params:
    div_factor: 6              # starts at lr / 10
    pct_start: 0.0                                     # reaches lr at 30% of total steps
    final_div_factor: 1                                # ends at lr / 10 / 10
    # should addressing from runner level
    max_lr: ${runner.optimizer.optimizer_params.lr}     
    epochs: ${runner.trainer.max_epochs}
    steps_per_epoch: ???
    cycle_momentum: False


trainer:
  max_epochs: 200
  log_every_n_steps: 50

  num_nodes: 1
  devices: -1
  precision: 32

  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1

  accumulate_grad_batches: 1
tags: 
  - train