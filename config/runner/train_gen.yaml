defaults:
  - model: musicgen
  - _self_

# Dataset integration is intentionally left external at this stage.  The
# Lightning model consumes the batch contract documented by MusciGen.
dataset: null
metrics: []

loader:
  train_loader_params:
    batch_size: 2
    num_workers: 4
    persistent_workers: True
    
  val_loader_params:
    batch_size: 2
    num_workers: 4
    persistent_workers: True


optimizer:
  name: AdamW
  optimizer_params:
    lr: 0.0001
    weight_decay: 0


scheduler:
  name: OneCycleLR
  interval: step
  frequency: 1
  scheduler_params:
    max_lr: ${runner.optimizer.optimizer_params.lr}
    epochs: ${runner.trainer.max_epochs}
    # scripts/run.py may replace this after the datamodule is constructed.
    steps_per_epoch: 1
    div_factor: 10
    pct_start: 0.1
    final_div_factor: 10
    cycle_momentum: False


trainer:
  max_epochs: 20
  log_every_n_steps: 10

  num_nodes: 1
  devices: -1
  precision: 16-mixed

  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1

  accumulate_grad_batches: 1
tags: 
  - train_gen
