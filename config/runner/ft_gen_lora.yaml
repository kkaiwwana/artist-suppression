defaults:
  - model: musicgen
  - dataset: jmd_max_caps
  - _self_

metrics: []

loader:
  train_loader_params:
    batch_size: 16
    num_workers: 8
    persistent_workers: True
    
  val_loader_params:
    batch_size: 16
    # Validation is short relative to training. Reading in the main process
    # avoids long-run Windows worker/IPC stalls at epoch boundaries.
    num_workers: 0
    persistent_workers: False


optimizer:
  name: AdamW
  optimizer_params:
    # Only the randomly initialized explicit controller trains by default.
    lr: 0.0001
    weight_decay: 0


# A fixed learning rate avoids gate-opening transients and AMP scheduler-step
# mismatches when a scaled optimizer step is skipped.
scheduler: null

checkpoint:
  monitor: val/loss_total
  mode: min
  save_top_k: 3
  save_last: true

validation_audio:
  every_n_epochs: 1
  num_samples: 2
  generation_seed: ${exp.seed}
  max_audio_seconds: 10.0
  # Samples are captured once from the train loader and reused every epoch.
  log_key: training/audio_comparisons
  fail_on_error: false
  generation_kwargs:
    do_sample: true
    guidance_scale: 1.0
    max_new_tokens: 250


trainer:
  max_epochs: 10
  log_every_n_steps: 30

  accelerator: auto
  num_nodes: 1
  devices: -1
  precision: 16-mixed
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1

  accumulate_grad_batches: 1
tags: 
  - train_gen
