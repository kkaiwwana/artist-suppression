defaults:
  - model: unlearnable_musicgen
  - dataset: jmd_max_caps
  - _self_


metrics: []

loader:
  train_loader_params:
    batch_size: 16
    num_workers: 8
    persistent_workers: True
    
  val_loader_params:
    batch_size: 16
    # Validation is short relative to training. Reading in the main process
    # avoids long-run Windows worker/IPC stalls at epoch boundaries.
    num_workers: 0
    persistent_workers: False


optimizer:
  name: AdamW
  optimizer_params:
    # Only the randomly initialized explicit controller trains by default.
    lr: 0.00008
    weight_decay: 0


# A fixed learning rate avoids gate-opening transients and AMP scheduler-step
# mismatches when a scaled optimizer step is skipped.
scheduler: null

checkpoint:
  monitor: val/loss_total
  mode: min
  save_top_k: 6
  save_last: true

validation_audio:
  # The comprehensive fixed-cohort callback below supersedes this compact
  # qualitative table for explicit-control training.
  enabled: false
  every_n_epochs: 1
  num_samples: 2
  generation_seed: ${exp.seed}
  max_audio_seconds: 10.0
  # Samples are captured once from the train loader and reused every epoch.
  log_key: training/audio_comparisons
  fail_on_error: false
  generation_kwargs:
    do_sample: true
    guidance_scale: 3.0
    max_new_tokens: 250

# Fixed, matched evaluation after every epoch: 4 artists x 16 clips x six
# control scenarios. The classifier checkpoint must serialize
# `artist_vocabulary`; external representation models download lazily.
epoch_control_evaluation:
  enabled: true
  every_n_epochs: 1
  num_artists: 8
  clips_per_artist: 32
  generation_batch_size: 16
  metric_batch_size: 8
  generation_seed: ${exp.seed}
  cohort_seed: ${exp.seed}
  audio_prompt_seconds: 5.0
  continuation_seconds: 10.0
  multi_min_artists: 2
  multi_max_artists: 5
  classifier_checkpoint_path: ${oc.env:ARTIST_CLASSIFIER_CHECKPOINT,logs/0731_144615@trian_classifier_64cls_continuation/ckpts/last.ckpt}
  classifier_config_path: ${oc.env:ARTIST_CLASSIFIER_CONFIG,null}
  classifier_model_name_or_path: ${oc.env:CLASSIFIER_MERT_MODEL,null}
  mert_model_name_or_path: ${oc.env:MERT_MODEL,m-a-p/MERT-v1-95M}
  clap_model_name_or_path: ${oc.env:CLAP_MODEL,laion/clap-htsat-unfused}
  # false permits Hugging Face/Torch Hub/PaSST checkpoints to download online.
  local_files_only: false
  metric_device: null
  # Keep one visible W&B panel. Detailed mean/std histories are still logged,
  # but marked hidden so they remain available through the run API on demand.
  log_key: Control Evaluation/Results
  numeric_namespace: Control Evaluation Details
  cache_external_models: true
  quiet_external_models: true
  hide_detailed_metrics: true
  # Reuse one fixed cohort item and the six generated scenarios; this adds no
  # extra MusicGen forward and includes the shared 5 s real prefix for listening.
  qualitative_enabled: true
  qualitative_log_key: Qualitative Comparison/Matched Six Scenarios
  qualitative_sample_index: 0
  qualitative_include_prompt: true
  # Only the first 5 s are real tokens. Later scores are conditioned on the
  # model's sampled history at positions 1, 5, 10, ..., 100. Each curve point
  # averages cohort clips/codebooks; the main table averages these same points.
  gt_token_curve_max_positions: 100
  gt_token_curve_interval: 5
  gt_token_curve_table_log_key: Control Evaluation/Rollout GT Token Confidence by Position
  # Fixed-color image media; W&B keeps one snapshot per epoch under this key
  # and exposes its native step slider without a custom Vega chart.
  gt_token_curve_plot_log_key: Control Evaluation/Rollout GT Token Confidence Curves by Epoch
  fail_on_error: false
  generation_kwargs:
    do_sample: true
    guidance_scale: 3.0


trainer:
  max_epochs: 10
  log_every_n_steps: 10

  accelerator: auto
  num_nodes: 1
  devices: -1
  precision: 16-mixed
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

  limit_train_batches: 1.0
  limit_val_batches: 1.0
  val_check_interval: 1.0
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1

  accumulate_grad_batches: 1
tags: 
  - train_gen
