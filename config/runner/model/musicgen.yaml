_target_: src.model.base.BaseGenerationModel

model_cfg:
  generator:
    _target_: src.model.gen.musicgen.MusicGen.from_pretrained
    model_name_or_path: ${oc.env:MUSICGEN_MODEL,models/musicgen-small}
    use_adapter: true
    freeze_backbone: true
    adapter_rank: 32
    adapter_alpha: 32
    # Keep the autoregressive self-attention path frozen. Cross-attention K/V
    # depends on static text features and is the safer dataset-adaptation path.
    adapter_targets: [k_proj, v_proj]
    adapter_attention_types: [encoder_attn]
    # null adapts all 24 decoder layers. Override with e.g. [18,19,20,21,22,23].
    adapter_layers: [18, 19, 20, 21, 22, 23]
    adapter_dropout: 0.0
    adapter_zero_init: true
    # Match the original AudioCraft pretraining/generation factorisation.
    # Set false only to reproduce historical synchronous-teacher-forcing runs.
    use_delay_pattern_teacher_forcing: true
    # Optional weight initialization only; this is not a Lightning resume.
    adapter_checkpoint: null
    adapter_checkpoint_strict: true
    model_kwargs:
      local_files_only: true
    processor_kwargs:
      local_files_only: true

  test_generation:
    do_sample: true
    guidance_scale: 3.0
    top_k: 250
    temperature: 1.0
    max_new_tokens: 512

log_backend: wandb
