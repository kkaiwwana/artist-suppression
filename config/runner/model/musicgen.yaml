_target_: src.model.base.BaseGenerationModel

model_cfg:
  generator:
    _target_: src.model.gen.musicgen.MusicGen.from_pretrained
    model_name_or_path: ${oc.env:MUSICGEN_MODEL,models/musicgen-small}
    use_adapter: true
    freeze_backbone: true
    adapter_rank: 8
    adapter_alpha: 8
    # Authentic linear LoRA on both decoder self- and cross-attention.
    # Q/V is the standard default; K and output projections remain frozen.
    adapter_targets: [q_proj, v_proj]
    # null adapts all 24 decoder layers. Override with e.g. [18,19,20,21,22,23].
    adapter_layers: [18, 19, 20, 21, 22, 23]
    adapter_dropout: 0.0
    adapter_zero_init: true
    # Optional weight initialization only; this is not a Lightning resume.
    adapter_checkpoint: null
    adapter_checkpoint_strict: true
    model_kwargs:
      local_files_only: true
    processor_kwargs:
      local_files_only: true

  test_generation:
    do_sample: true
    guidance_scale: 1.0
    max_new_tokens: 512

log_backend: wandb
