defaults:
  - _self_
  - runner: ???

exp:
  project: mus_unlearning_${runner.tags[0]}
  uuid: ${now:%m%d_%H%M%S}@${exp.cmt}
  cmt: null_comment
  save_dir: ${hydra:runtime.cwd}/logs/${exp.uuid}
  seed: 0
  resume_from: ${oc.env:RESUME_FROM,null}

logging:
  # LOG_BACKEND=wandb (default) or LOG_BACKEND=swanlab.
  backend: ${oc.env:LOG_BACKEND,swanlab}

wandb:
  entity: ${oc.env:WANDB_ENTITY,null}
  mode: ${oc.env:WANDB_MODE,online}
  run_id: ${oc.env:WANDB_RUN_ID,null}
  log_model: false

swanlab:
  # Authentication is read by SwanLab from SWANLAB_API_KEY or `swanlab login`.
  workspace: ${oc.env:SWANLAB_WORKSPACE,null}
  mode: ${oc.env:SWANLAB_MODE,online}
  run_id: ${oc.env:SWANLAB_RUN_ID,null}
  resume: allow
  description: null
  public: false

hydra:
  run:
    dir: ${exp.save_dir}/hydra_output
