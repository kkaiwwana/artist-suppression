defaults:
  - _self_
  - runner: train_gen

exp:
  project: mus_unlearning_${runner.tags[0]}
  uuid: ${now:%m%d_%H%M%S}@${exp.cmt}
  cmt: null_comment
  save_dir: ${hydra:runtime.cwd}/logs/${exp.uuid}
  seed: 2026

hydra:
  run:
    dir: ${exp.save_dir}/hydra_output

checkpoint:
  _target_: src.callback.checkpoint.Checkpoint
  output_path: ${exp.save_dir}/checkpoints
  exp_id: ${exp.uuid}
  monitor: mIoU
  topk_models: 1
